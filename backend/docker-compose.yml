services:
  postgres:
    image: postgres:17-alpine
    container_name: yuntech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yuntech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuntech_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-yuntech_freshman}
      TZ: Asia/Taipei
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yuntech} -d ${POSTGRES_DB:-yuntech_freshman}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yuntech-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-yuntech_redis_pw}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-yuntech_redis_pw}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
