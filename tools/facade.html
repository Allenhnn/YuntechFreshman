<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facade Tool · 雲科新鮮人</title>
    <style>
      :root { --bg: #1b1f22; --panel: #252a2e; --line: #3a4147; --text: #e6e8ea; --dim: #9aa3ab; --accent: #3fb07a; --warn: #e0a040; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; display: grid; grid-template-columns: 270px 1fr 340px; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, sans-serif; }
      aside, section { overflow-y: auto; padding: 12px; }
      aside { background: var(--panel); border-right: 1px solid var(--line); }
      aside.right { border-right: 0; border-left: 1px solid var(--line); }
      main { position: relative; overflow: hidden; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 16px 0 6px; }
      h2:first-child { margin-top: 0; }
      select, input, button { font: inherit; color: var(--text); background: #1d2124; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
      select { width: 100%; }
      button { cursor: pointer; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0d1a13; font-weight: 600; }
      button.on { outline: 2px solid var(--accent); }
      .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
      .row label { flex: 1; color: var(--dim); }
      .row input[type=number] { width: 72px; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      #photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      #photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
      #photos img.sel { border-color: var(--accent); }
      canvas { display: block; }
      #view { width: 100%; height: 100%; cursor: crosshair; }
      #footprint, #edgeOut, #stylePreview { width: 100%; background: #15181a; border-radius: 6px; }
      #hint { position: absolute; left: 12px; top: 10px; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
      #log { white-space: pre-wrap; font: 11px/1.4 ui-monospace, monospace; color: var(--dim); background: #15181a; padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto; }
      #pano { position: absolute; inset: 0; background: #111416; }
      #tabs { position: absolute; right: 12px; top: 10px; display: flex; gap: 4px; z-index: 2; }
      .sv-msg { padding: 60px 24px; color: var(--dim); max-width: 520px; }
      .sv-msg code { color: var(--text); }
      .muted { color: var(--dim); }
      .warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <aside>
      <h2>Building</h2>
      <select id="folder"></select>
      <div class="row"><button id="ingest">Rescan photos</button><span id="bInfo" class="muted"></span></div>
      <h2>Wall (click an edge)</h2>
      <canvas id="footprint" width="480" height="360"></canvas>
      <div id="edgeInfo" class="muted"></div>
      <h2>Photos</h2>
      <div id="photos"></div>
    </aside>
    <main>
      <canvas id="view"></canvas>
      <div id="pano" hidden></div>
      <div id="hint"></div>
      <div id="tabs"><button id="tabPhoto" class="on">照片</button><button id="tabStreet">街景參考</button></div>
    </main>
    <aside class="right">
      <h2>Section of the wall these corners cover (m)</h2>
      <div class="grid2">
        <div class="row"><label>from left</label><input id="a0" type="number" step="0.1" /></div>
        <div class="row"><label>to</label><input id="a1" type="number" step="0.1" /></div>
        <div class="row"><label>from ground</label><input id="h0" type="number" step="0.1" /></div>
        <div class="row"><label>to</label><input id="h1" type="number" step="0.1" /></div>
      </div>
      <div class="row"><button id="clearCorners">Clear corners</button><button id="addSection" class="primary">Rectify section →</button></div>
      <h2>Rectified wall</h2>
      <canvas id="edgeOut" width="600" height="240"></canvas>
      <div class="row"><button id="clearWall">Clear wall</button><button id="saveWall" class="primary">Save wall</button></div>
      <h2>Procedural style (sampled from photos)</h2>
      <div class="grid2">
        <div class="row"><label>wall</label><input id="cWall" type="color" /><button data-pick="wall">🎯</button></div>
        <div class="row"><label>trim</label><input id="cTrim" type="color" /><button data-pick="trim">🎯</button></div>
        <div class="row"><label>glass</label><input id="cGlass" type="color" /><button data-pick="glass">🎯</button></div>
        <div class="row"><label>pattern</label><select id="pattern"><option>punched</option><option>ribbon</option><option>curtain</option><option>blank</option></select></div>
        <div class="row"><label>bay m</label><input id="bay" type="number" step="0.1" /></div>
        <div class="row"><label>sill</label><input id="sill" type="number" step="0.01" /></div>
        <div class="row"><label>win w</label><input id="winW" type="number" step="0.01" /></div>
        <div class="row"><label>win h</label><input id="winH" type="number" step="0.01" /></div>
      </div>
      <div class="row"><label><input id="groundGlass" type="checkbox" /> glazed ground floor</label></div>
      <h2>3D details (set by eye from 街景參考)</h2>
      <div class="grid2">
        <div class="row"><label>balcony</label><select id="balcony"><option value="none">none</option><option value="continuous">per floor</option><option value="bay">per bay</option></select></div>
        <div class="row"><label>depth m</label><input id="balconyDepth" type="number" step="0.1" min="0.5" max="3" /></div>
        <div class="row"><label>sunshade</label><select id="fins"><option value="none">none</option><option value="horizontal">horizontal</option><option value="vertical">vertical</option><option value="both">both</option></select></div>
        <div class="row"><label>depth m</label><input id="finDepth" type="number" step="0.1" min="0.1" max="2" /></div>
        <div class="row"><label>parapet m</label><input id="parapet" type="number" step="0.1" min="0" max="2" /></div>
        <div class="row"><label><input id="columns" type="checkbox" /> columns</label></div>
        <div class="row"><label><input id="canopy" type="checkbox" /> entrance canopy</label></div>
        <div class="row"><label><input id="rooftop" type="checkbox" /> rooftop units</label></div>
      </div>
      <canvas id="stylePreview" width="600" height="220"></canvas>
      <div class="row"><button id="saveStyle" class="primary">Save style</button></div>
      <h2>Log</h2>
      <div id="log"></div>
    </aside>
    <script type="module" src="/src/tools/facadeTool.ts"></script>
  </body>
</html>
